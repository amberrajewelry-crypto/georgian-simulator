<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>სიმულატორი - 200 კითხვა</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 98vh;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            text-align: center;
            position: relative;
            flex-shrink: 0;
        }
        .header h1 { font-size: 20px; margin-bottom: 5px; }
        .header p { opacity: 0.9; font-size: 13px; }
        .timer {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 16px;
            font-weight: 700;
            background: rgba(255,255,255,0.2);
            padding: 5px 12px;
            border-radius: 6px;
        }
        .timer.warning { background: #ff9800; }
        .timer.danger { background: #f44336; }
        .progress-bar {
            height: 4px;
            background: rgba(255,255,255,0.3);
            width: 100%;
            margin-top: 10px;
        }
        .progress-fill {
            height: 100%;
            background: #4CAF50;
            transition: width 0.3s;
        }
        .content {
            padding: 15px 20px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .filter-section {
            background: #f9f9f9;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
        }
        .filter-section.show { display: block; }
        .filter-label { font-weight: 600; color: #333; margin-bottom: 8px; font-size: 13px; }
        .section-filter { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 6px; }
        .filter-btn {
            padding: 6px 10px;
            border: 2px solid #ddd;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .filter-btn:hover { border-color: #667eea; }
        .filter-btn.active {
            background: #667eea;
            border-color: #667eea;
            color: white;
        }
        .question-block { flex: 1; }
        .question-num { color: #667eea; font-size: 12px; font-weight: 600; margin-bottom: 5px; }
        .question-text { font-size: 18px; font-weight: 600; margin-bottom: 10px; color: #333; }
        .question-ctx {
            background: #f5f5f5;
            padding: 12px;
            border-left: 4px solid #667eea;
            margin-bottom: 15px;
            font-size: 14px;
            line-height: 1.5;
            border-radius: 4px;
        }
        .options { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 15px; }
        .option {
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
            font-size: 14px;
            font-weight: 500;
        }
        .option:hover:not(.disabled) { border-color: #667eea; background: #f0f4ff; }
        .option.disabled { cursor: default; opacity: 0.7; }
        .option.correct { background: #e8f5e9; border-color: #4CAF50; color: #1b5e20; }
        .option.incorrect { background: #ffebee; border-color: #f44336; color: #c62828; }
        .explanation {
            background: #fffbea;
            border-left: 4px solid #ffc107;
            padding: 12px;
            margin: 15px 0;
            border-radius: 4px;
            display: none;
            font-size: 14px;
            line-height: 1.5;
        }
        .explanation.show { display: block; }
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 15px 0;
            padding: 12px;
            background: #f9f9f9;
            border-radius: 6px;
            font-size: 13px;
            display: none;
        }
        .stats.show { display: grid; }
        .stat { text-align: center; }
        .stat-value { font-size: 20px; font-weight: 700; color: #667eea; }
        .stat-label { color: #666; margin-top: 3px; }
        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
            flex-shrink: 0;
        }
        .button {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .button-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .button-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102,126,234,0.3); }
        .button-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .final-screen {
            text-align: center;
            display: none;
            justify-content: center;
            flex: 1;
        }
        .final-screen.show { display: flex; flex-direction: column; }
        .final-message { font-size: 20px; color: #333; margin-bottom: 10px; }
        .final-score { font-size: 48px; font-weight: 700; color: #667eea; margin: 10px 0; }
        .final-percent { font-size: 16px; color: #666; margin-bottom: 20px; }
        .section-breakdown { background: #f9f9f9; padding: 12px; border-radius: 6px; margin: 15px 0; text-align: left; font-size: 13px; }
        .section-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #eee; }
        .section-item:last-child { border-bottom: none; }
        .loading { text-align: center; padding: 20px; color: #999; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="timer" id="timer">⏱ 2:00:00</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <h1>📝 სიმულატორი</h1>
            <p>200 კითხვა / ქართული ენა</p>
        </div>

        <div class="content">
            <div class="filter-section" id="filterSection">
                <div class="filter-label">🔍 ფილტრი:</div>
                <div class="section-filter" id="sectionFilter"></div>
            </div>

            <div class="question-block" id="questionBlock">
                <div class="loading">იტვირთება...</div>
            </div>

            <div class="final-screen" id="finalScreen">
                <div class="final-message" id="finalMessage"></div>
                <div class="final-score" id="finalScore"></div>
                <div class="final-percent" id="finalPercent"></div>
                <div class="section-breakdown" id="sectionBreakdown"></div>
            </div>

            <div class="stats" id="stats">
                <div class="stat">
                    <div class="stat-value" id="correctCount">0</div>
                    <div class="stat-label">სწორი</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="totalCount">0</div>
                    <div class="stat-label">სულ</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="percentCount">0%</div>
                    <div class="stat-label">%</div>
                </div>
            </div>

            <div class="buttons" id="buttons">
                <button class="button button-primary" id="prevBtn" onclick="prevQuestion()">← უკან</button>
                <button class="button button-primary" id="nextBtn" onclick="nextQuestion()">შემდეგი →</button>
            </div>
        </div>
    </div>

    <script>
        let questions = [];
        let currentIndex = 0;
        let answered = new Map();
        let correct = new Set();
        let filteredQuestions = [];
        let selectedSection = null;
        let timerInterval = null;
        let timeRemaining = 120 * 60;
        const STORAGE_KEY = 'sim-v3';

        // Fetch bank data
        async function loadBank() {
            try {
                const r = await fetch('bank.json');
                return await r.json();
            } catch (e) {
                console.error(e);
                return [];
            }
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeRemaining--;
                const h = Math.floor(timeRemaining / 3600);
                const m = Math.floor((timeRemaining % 3600) / 60);
                const s = timeRemaining % 60;
                const t = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
                const el = document.getElementById('timer');
                el.textContent = `⏱ ${t}`;
                el.classList.remove('warning', 'danger');
                if (timeRemaining < 300) el.classList.add('danger');
                else if (timeRemaining < 900) el.classList.add('warning');
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    showFinal();
                }
            }, 1000);
        }

        function save() {
            const state = {
                answered: Object.fromEntries(answered),
                correct: Array.from(correct)
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function load() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (!stored) return;
            const state = JSON.parse(stored);
            answered = new Map(Object.entries(state.answered).map(([k, v]) => [parseInt(k), v]));
            correct = new Set(state.correct.map(x => parseInt(x)));
        }

        async function init() {
            questions = await loadBank();
            if (!questions.length) {
                document.getElementById('questionBlock').innerHTML = '<div class="loading" style="color:red;">❌ Errors loading bank</div>';
                return;
            }
            load();
            filteredQuestions = [...questions];
            buildFilters();
            show(0);
            startTimer();
        }

        function buildFilters() {
            const sections = [...new Set(questions.map(q => q.sec))];
            let html = sections.map(s => `<button class="filter-btn" onclick="setFilter('${s}')">${s}</button>`).join('');
            html += `<button class="filter-btn" onclick="setFilter(null)">ყველა</button>`;
            html += `<button class="filter-btn" onclick="showErrors()" style="margin-left:auto;">🔴 შეცდომები</button>`;
            document.getElementById('sectionFilter').innerHTML = html;
            document.getElementById('filterSection').classList.add('show');
            setFilter(null);
        }

        function setFilter(sec) {
            selectedSection = sec;
            currentIndex = 0;
            filteredQuestions = sec ? questions.filter(q => q.sec === sec) : [...questions];
            document.querySelectorAll('.filter-btn').forEach(b => {
                b.classList.toggle('active', (!sec && b.textContent === 'ყველა') || (sec && b.textContent === sec));
            });
            updateStats();
            show(0);
        }

        function showErrors() {
            const errorIds = new Set();
            questions.forEach((q, i) => {
                if (answered.has(i) && !correct.has(i)) errorIds.add(i);
            });
            filteredQuestions = questions.filter((q, i) => errorIds.has(i));
            if (filteredQuestions.length === 0) {
                alert('✅ ყველა სწორი!');
                setFilter(null);
                return;
            }
            currentIndex = 0;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('.filter-btn:last-child').classList.add('active');
            updateStats();
            show(0);
        }

        function show(idx) {
            if (idx >= filteredQuestions.length) {
                showFinal();
                return;
            }
            currentIndex = idx;
            const q = filteredQuestions[idx];
            const qIdx = questions.indexOf(q);

            let html = `<div class="question-num">კითხვა ${idx + 1}/${filteredQuestions.length}</div>`;
            html += `<div class="question-text">${q.q}</div>`;
            html += `<div class="question-ctx">${q.ctx}</div>`;
            html += '<div class="options">';

            const isAnswered = answered.has(qIdx);
            q.opts.forEach((opt, i) => {
                let cls = 'option';
                if (isAnswered) cls += ' disabled';
                if (isAnswered && i === q.a) cls += ' correct';
                if (isAnswered && answered.get(qIdx) === i && i !== q.a) cls += ' incorrect';
                html += `<div class="${cls}" onclick="answer(${qIdx}, ${i}, ${q.a})">${opt}</div>`;
            });
            html += '</div>';

            if (isAnswered) {
                html += `<div class="explanation show"><strong>📌</strong> ${q.why}</div>`;
            }

            document.getElementById('questionBlock').innerHTML = html;
            updateProgressBar();
            updateStats();
            document.getElementById('prevBtn').disabled = idx === 0;
            document.getElementById('nextBtn').disabled = !isAnswered;
            document.getElementById('stats').classList.add('show');
        }

        function answer(qIdx, optIdx, correctIdx) {
            if (answered.has(qIdx)) return;
            answered.set(qIdx, optIdx);
            if (optIdx === correctIdx) correct.add(qIdx);
            save();
            
            document.querySelectorAll('.option').forEach((el, i) => {
                el.classList.add('disabled');
                if (i === correctIdx) el.classList.add('correct');
                else if (i === optIdx && optIdx !== correctIdx) el.classList.add('incorrect');
            });
            
            const expl = document.querySelector('.explanation');
            if (!expl) {
                const newExpl = document.createElement('div');
                newExpl.className = 'explanation show';
                newExpl.innerHTML = `<strong>📌</strong> ${questions[qIdx].why}`;
                document.querySelector('.options').after(newExpl);
            }
            
            document.getElementById('nextBtn').disabled = false;
            updateStats();
        }

        function prevQuestion() {
            if (currentIndex > 0) show(currentIndex - 1);
        }

        function nextQuestion() {
            if (currentIndex + 1 < filteredQuestions.length) show(currentIndex + 1);
        }

        function updateProgressBar() {
            const p = (answered.size / questions.length) * 100;
            document.getElementById('progressFill').style.width = p + '%';
        }

        function updateStats() {
            document.getElementById('correctCount').textContent = correct.size;
            document.getElementById('totalCount').textContent = answered.size;
            const pct = answered.size > 0 ? Math.round((correct.size / answered.size) * 100) : 0;
            document.getElementById('percentCount').textContent = pct + '%';
        }

        function showFinal() {
            clearInterval(timerInterval);
            const pct = Math.round((correct.size / questions.length) * 100);
            let msg = '✅';
            if (pct < 50) msg = '❌';
            else if (pct < 70) msg = '⚠️';
            else if (pct >= 90) msg = '🏆';

            document.getElementById('finalMessage').textContent = msg;
            document.getElementById('finalScore').textContent = `${correct.size}/${questions.length}`;
            document.getElementById('finalPercent').textContent = `${pct}%`;

            const sections = [...new Set(questions.map(q => q.sec))];
            let breakdown = '';
            sections.forEach(s => {
                const qqs = questions.filter(q => q.sec === s);
                const cc = qqs.filter((q, idx) => questions.indexOf(q) < answered.size && correct.has(questions.indexOf(q))).length;
                const aa = qqs.filter(q => answered.has(questions.indexOf(q))).length;
                const pp = aa > 0 ? Math.round((cc / aa) * 100) : 0;
                breakdown += `<div class="section-item"><span>${s}</span><span>${cc}/${aa} (${pp}%)</span></div>`;
            });
            document.getElementById('sectionBreakdown').innerHTML = breakdown || '<div>No answers yet</div>';

            document.getElementById('questionBlock').style.display = 'none';
            document.getElementById('stats').classList.remove('show');
            document.getElementById('buttons').style.display = 'none';
            document.getElementById('filterSection').style.display = 'none';
            document.getElementById('finalScreen').classList.add('show');
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft') prevQuestion();
            else if (e.key === 'ArrowRight') nextQuestion();
            else if (e.key === 'Enter') {
                const opt = document.querySelector('.option:not(.disabled)');
                if (opt) opt.click();
            }
        });

        init();
    </script>
</body>
</html>
